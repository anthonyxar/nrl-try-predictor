name: Scrape NRL Data

# No `schedule:` trigger — ongoing scraping now runs as a background loop
# inside the backend itself (main.py's _scrape_sync, every 30 min), since
# GitHub's schedule trigger proved unreliable (queueing delays under load,
# and GitHub auto-disables it after 60 days of repo inactivity with no
# self-recovery — see docs/adr/0005-in-process-scrape-sync.md). This
# workflow is kept for manual use: bootstrapping an empty DB, or a manual
# full/incremental re-scrape if the backend's own loop is ever suspect.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scrape_job.py
